# Railway Production Configuration
# ================================
# Solar PV Testing LIMS-QMS System
# FIXED: Use shell wrapper for proper $PORT expansion

[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt"

[deploy]
# Streamlit server configuration - using sh -c for proper variable expansion
startCommand = "sh -c 'streamlit run app.py --server.port=${PORT:-8501} --server.address=0.0.0.0 --server.headless=true --server.enableCORS=false --server.enableXsrfProtection=false'"

# Health check configuration - extended timeout for Streamlit startup
healthcheckPath = "/"
healthcheckTimeout = 300

# Restart policy
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[service]
# Service naming
name = "web"
