# Railway Production Configuration
# ================================
# Solar PV Testing LIMS-QMS System
# FIXED: Use shell wrapper for proper $PORT expansion

[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt"

[deploy]
# Run migrations before starting app
# The start script runs database migrations then starts Streamlit
startCommand = "bash scripts/start_with_migrations.sh"

# Health check configuration - extended timeout for Streamlit startup
healthcheckPath = "/"
healthcheckTimeout = 300

# Restart policy
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[service]
# Service naming
name = "web"
