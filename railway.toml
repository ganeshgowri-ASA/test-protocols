# Railway Production Configuration
# ================================
# Solar PV Testing LIMS-QMS System
# CRITICAL FIX: Uses health proxy for instant healthcheck response

[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt"

[deploy]
# Start health proxy (which starts Streamlit in background)
startCommand = "python health_proxy.py"

# Health check configuration - hits Flask /health endpoint
healthcheckPath = "/health"
healthcheckTimeout = 30  # Health proxy responds in <1 second

# Restart policy
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[service]
# Internal port for health proxy (Streamlit runs on 8501)
internalPort = 8000
